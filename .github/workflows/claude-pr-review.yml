name: Claude Issue Triage
description: Run Claude Code to triage new GitHub issues and comment back with findings

on:
  issues:
    types: [opened]

jobs:
  triage-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code for Issue Triage
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            Triage GitHub issue #${{ github.event.issue.number }} in repository ${{ github.repository }}.

            Read the issue title and description, then analyze the issue using the repository context.

            Provide a concise triage report containing:
            - Summary of the issue
            - Issue type (bug, feature request, documentation, security, or other)
            - Severity and priority, with a brief justification
            - Reproduction steps or missing information, if applicable
            - Relevant files or components, if identifiable
            - Recommended next steps

          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
